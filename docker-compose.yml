services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: veggtable-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Veggtable#7}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - veggtable-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/VEGG.TABLE.API/Dockerfile
    container_name: veggtable-api
    ports:
      - "127.0.0.1:7277:7277"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=master;User Id=sa;Password=Veggtable#7;TrustServerCertificate=true;"
      Jwt__Key: "YourSuperSecretKeyMustBeAtLeast16CharactersLong"
      Jwt__Issuer: "VEGG.TABLE.API"
      Jwt__Audience: "VEGG.TABLE.Client"
      ASPNETCORE_URLS: "http://+:7277"
    depends_on:
      sqlserver:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: src/VEGG.TABLE.Client/Dockerfile
    container_name: veggtable-client
  
  caddy:
    image: caddy:latest
    container_name: veggtable-proxy
    ports:
      - "5209:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - client
      - api

volumes:
  veggtable-mssql-data:
  caddy_data: